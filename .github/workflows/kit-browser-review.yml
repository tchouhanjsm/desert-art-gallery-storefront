name: DAG Structural Kit Browser Review

on:
  pull_request:
    paths:
      - "design/owner-controlled-kit-v2/**"
      - "scripts/kit_browser_review.py"
      - "requirements-browser.txt"
      - ".github/workflows/kit-browser-review.yml"
  push:
    branches:
      - main
    paths:
      - "design/owner-controlled-kit-v2/**"
      - "scripts/kit_browser_review.py"
      - "requirements-browser.txt"
      - ".github/workflows/kit-browser-review.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium-structural-review:
    name: Chromium responsive and interaction review
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-browser.txt

      - name: Install isolated browser-review dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-browser.txt

      - name: Install Chromium and system dependencies
        run: python -m playwright install --with-deps chromium

      - name: Review nine pages and five customer journeys at five required widths
        run: |
          python3 scripts/kit_browser_review.py \
            --output-dir artifacts/kit-browser-review

      - name: Upload screenshots and review summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dag-kit-browser-review-${{ github.run_number }}-${{ github.sha }}
          path: artifacts/kit-browser-review/
          if-no-files-found: warn
          retention-days: 14
