<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc"><title id="title">Graphic Atelier — mobile exploration</title><desc id="desc">High-contrast modernist retail. Abstract mobile storefront layout, design placeholder, not DAG product imagery.</desc><rect width="390" height="844" fill="#F8F1E7"/><text x="18" y="23" font-family="Arial,sans-serif" font-size="8" font-weight="700" letter-spacing="1.3" fill="#182C6B">DAG / OWNER REVIEW / EXPLORATION</text><rect x="15" y="40" width="360" height="40" fill="#F2C9B8" stroke="#182C6B"/><text x="28" y="66" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#182C6B">DAG / GALLERY</text><text x="330" y="66" font-family="Inter,Arial,sans-serif" font-size="12" fill="#182C6B">☰</text><rect x="15" y="80" width="360" height="350" fill="#F2C9B8"/><text x="30" y="116" font-family="Inter,Arial,sans-serif" font-size="9" font-weight="700" letter-spacing="1" fill="#182C6B">NUMBERED COLLECTION EDITS · GRAPHIC</text><text x="28" y="180" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="800" fill="#182C6B">MADE TO BE SEEN.</text><text x="30" y="265" font-family="Inter,Arial,sans-serif" font-size="12" fill="#43517C">Sample content for direction comparison.</text><rect x="30" y="286" width="160" height="32" fill="#F0442E"/><text x="40" y="306" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="700" fill="#F8F1E7">EXPLORE →</text><rect x="15" y="430" width="360" height="170" fill="#F0442E"/><path d="M15 430 L140 430 L375 600 L240 600 Z" fill="#E9B92F"/><circle cx="250" cy="515" r="48" fill="#FFFDF8"/><text x="360" y="584" text-anchor="end" font-family="Arial,sans-serif" font-size="8" fill="#182C6B">ABSTRACT / NOT PRODUCT</text><text x="18" y="632" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="700" fill="#182C6B">SELECTED OBJECTS</text><g transform="translate(15 650)"><rect width="170" height="140" fill